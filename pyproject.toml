[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-autocoach"
version = "0.1.0"
description = "Autonomous running coach that writes next week's workouts to your Garmin and adjusts from how your body responded"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["garmin", "running", "training-plan", "coach", "agent"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "garminconnect==0.3.2",
  "rich>=13",
  "pydantic>=2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
autocoach = "garmin_autocoach.cli:main"

[project.urls]
Homepage = "https://github.com/dlekdns08/garmin-autocoach"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_autocoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
